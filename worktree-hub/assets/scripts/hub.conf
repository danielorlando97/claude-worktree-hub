# Hub configuration, sourced by scripts/wt-lib.sh. Plain bash, no spaces around "=".
MAIN_REPO="{{REPO}}"          # folder of the main checkout inside the hub
BASE_BRANCH="{{BASE_BRANCH}}" # new worktrees fork from $REMOTE/$BASE_BRANCH; PRs target it
REMOTE="{{REMOTE}}"

# Shared local config, hard-linked from the main checkout into every worktree.
# Always linked: .env and *.env (not *.env.example). Add exact file basenames here:
EXTRA_LINK_NAMES=""           # e.g. "local.settings.json"
